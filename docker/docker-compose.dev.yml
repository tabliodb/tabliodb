name: tabliodb-dev

services:
  database:
    image: postgres:17-alpine
    container_name: tabliodb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tabliodb}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - tabliodb_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tabliodb}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: tabliodb_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  db_ui:
    image: adminer:latest
    container_name: tabliodb_adminer
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Adminer berjalan di network Docker yang sama, jadi default server harus nama service Postgres, bukan localhost.
      ADMINER_DEFAULT_SERVER: database
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  tabliodb_postgres:
